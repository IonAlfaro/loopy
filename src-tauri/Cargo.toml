[package]
name = "loors"
version = "0.1.7"
description = "Visual agentic development loop studio with embedded local inference"
authors = ["Loors"]
edition = "2021"
default-run = "loors"
autobins = false

[[bin]]
name = "loors"
path = "src/main.rs"

[[bin]]
name = "loors-cli"
path = "src/bin/loors-cli.rs"

[lib]
name = "loors_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
dirs = "6"
tokio-tungstenite = "0.24"
base64 = "0.22"
regex = "1"
semver = "1"
tempfile = "3"
