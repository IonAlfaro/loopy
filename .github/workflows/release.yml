name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  validate-tag:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag against application version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            test "$GITHUB_REF_NAME" = main
            git fetch origin --tags
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || { echo "Delete the outdated tag $tag before running manually"; exit 1; }
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-unix:
    needs: validate-tag
    name: Build & Publish (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOORS_UPDATE_REPO: ${{ github.repository }}
        with:
          tagName: ${{ needs.validate-tag.outputs.tag }}
          releaseName: "Loors v__VERSION__"
          releaseBody: "Native installers for Windows (.exe / .msi), macOS (.dmg), and Linux (.AppImage / .deb)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-windows:
    needs: validate-tag
    name: Build, Sign (SignPath) & Publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers (NSIS & MSI)
        env:
          LOORS_UPDATE_REPO: ${{ github.repository }}
        run: npm run tauri build -- --bundles nsis,msi

      - name: Stage unsigned Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "staging/"
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination "staging/"
          Get-ChildItem staging/

      - name: Upload unsigned artifact for SignPath verification
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: loors-windows-unsigned
          path: staging/
          if-no-files-found: error
          retention-days: 1

      - name: Check if SignPath secrets are configured
        id: check-signpath
        shell: pwsh
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          if ($env:SP_TOKEN -and $env:SP_ORG) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Sign Windows installers with SignPath Foundation
        if: steps.check-signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'loors' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed-staging

      - name: Select release files (signed if available)
        id: pick-files
        shell: pwsh
        run: |
          if (Test-Path "signed-staging") {
            Write-Output "dir=signed-staging/*" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "dir=staging/*" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Windows installers to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: "Loors ${{ needs.validate-tag.outputs.tag }}"
          body: "Native installers for Windows (.exe / .msi), macOS (.dmg), and Linux (.AppImage / .deb)."
          draft: true
          fail_on_unmatched_files: true
          files: ${{ steps.pick-files.outputs.dir }}

  finalize-release:
    needs: [validate-tag, publish-unix, publish-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.validate-tag.outputs.tag }}" --draft=false --latest
