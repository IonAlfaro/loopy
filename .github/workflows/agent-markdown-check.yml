name: Agent Markdown dependency check
on:
  push:
    branches: [agent-rich-markdown]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-lockfile
          path: package-lock.json
