name: Agent Markdown dependency check
on:
  push:
    branches: [agent-rich-markdown]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Commit validated dependency lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock validated Markdown dependencies"
          git push origin HEAD:agent-rich-markdown
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-lockfile
          path: package-lock.json
